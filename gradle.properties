# Increase timeout for dependency downloads
systemProp.http.connectionTimeout=300000
systemProp.http.socketTimeout=300000
systemProp.https.connectionTimeout=300000
systemProp.https.socketTimeout=300000
# Enable parallel builds
org.gradle.parallel=true
org.gradle.caching=true
# Gradle daemon heap — default 512m is enough, but cap metaspace
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError
# Kotlin daemon — used both by Gradle builds and IntelliJ analysis
kotlin.daemon.jvm.options=-Xmx1536m -XX:+UseG1GC