
# ---- Server ------------------------------------------------------------------
server.port=8095
server.servlet.context-path=/

spring.application.name=briany-flowable
spring.main.allow-bean-definition-overriding=true

# ---- Datasource / JPA --------------------------------------------------------
# url, username, password — must be provided per environment (profile or env).
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none

# ---- Liquibase ---------------------------------------------------------------
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.database-change-log-table=brn_databasechangelog
spring.liquibase.database-change-log-lock-table=brn_databasechangeloglock

# ---- Jackson -----------------------------------------------------------------
spring.jackson.deserialization.fail-on-unknown-properties=false

# ---- BPM application (briany.*) ------------------------------------------
briany.security.auth.strategy=flowable
briany.security.allow-unauthenticated-engine-api=false
briany.engine.whitelist.enabled=true
briany.engine.whitelist.activities=user_task,service_task,call_activity,sub_process,script_task,business_rule_task

# ---- Flowable engine ---------------------------------------------------------
# flowable.common.app.idm-admin.password — must be provided per environment.
flowable.eventregistry.enabled=true
flowable.eventregistry.resource-location=classpath*:/eventregistry/
flowable.eventregistry.deployment-name=Flowable Event App
flowable.idm.ldap.enabled=false
flowable.idm.password-encoder=spring_bcrypt
flowable.rest-api-enabled=true

# ---- Actuator / Observability ------------------------------------------------
management.server.port=8096
management.endpoints.web.exposure.include=health,prometheus,info

# ---- Logging defaults --------------------------------------------------------
logging.level.ru.briany=INFO
logging.level.ru.briany.observability.metric.ExternalWorkerMetricsInterceptor=INFO
logging.level.ru.briany.activity=INFO
logging.level.org.flowable=INFO
logging.level.org.springframework=INFO
logging.level.org.apache.kafka=INFO
logging.level.org.hibernate=WARN
logging.level.liquibase=WARN
logging.level.io.opentelemetry=WARN
logging.level.io.grpc=WARN


