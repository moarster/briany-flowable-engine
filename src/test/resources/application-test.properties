flowable.common.app.idm-admin.password=Local-Dev-Password-12345
spring.datasource.url=jdbc:postgresql://localhost:5432/test
spring.datasource.username=test
spring.datasource.password=test
spring.datasource.driver-class-name=org.postgresql.Driver
# Hikari tuning for tests: Spring TestContext caching creates multiple
# ApplicationContexts (each with its own pool). Pools go idle between test
# classes, so keep at least 1 warm connection and give enough time to
# reconnect when a cached context is reused.
spring.datasource.hikari.max-lifetime=120000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=30000

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create-drop
flowable.database-schema-update=create-drop
flowable.async-executor-activate=false
flowable.history-level=audit


briany.security.auth.strategy=

spring.autoconfigure.exclude=net.ttddyy.observation.boot.autoconfigure.DataSourceObservationAutoConfiguration
# Logging for tests
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.org.flowable=WARN
logging.level.ru.briany=DEBUG
logging.level.org.springframework.boot.context.config=TRACE
# Spring TestContext cache diagnostics — prints HIT/MISS and cache size stats
logging.level.org.springframework.test.context.cache=DEBUG
# Disable other health checks that may fail
management.health.livenessState.enabled=false
management.health.readinessState.enabled=false
# Disable OTLP exporters: no collector runs in tests, otherwise every export
# interval prints "Connection refused" WARN to localhost:4318/4317.
management.otlp.metrics.export.enabled=false

