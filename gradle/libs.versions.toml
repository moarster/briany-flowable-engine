[versions]
camunda-feel = "1.22.0"
detekt = "2.0.0-alpha.6"
flowable = "8.0.0"
kotlin = "2.4.10"
ktlint = "14.2.0"
logstash = "9.0"
# ── Test ──────────────────────────────────────────────────────────────────────
mockito-kotlin = "6.3.0"
openapi-generator = "7.25.0"
spring-boot = "4.1.1"
testcontainers = "2.0.5"

[libraries]
camunda-feel = { module = "org.camunda.feel:feel-engine", version.ref = "camunda-feel" }
flowable-starter = { module = "org.flowable:flowable-spring-boot-starter", version.ref = "flowable" }
flowable-job = { module = "org.flowable:flowable-external-job-rest", version.ref = "flowable" }
jackson-kotlin = { module = "tools.jackson.module:jackson-module-kotlin" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect" }
liquibase = { module = "org.springframework.boot:spring-boot-starter-liquibase" }
logstash-encoder = { module = "net.logstash.logback:logstash-logback-encoder", version.ref = "logstash" }
mockito-kotlin = { module = "org.mockito.kotlin:mockito-kotlin", version.ref = "mockito-kotlin" }
postgresql = { module = "org.postgresql:postgresql" }
spring-boot-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-boot-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-devtools = { module = "org.springframework.boot:spring-boot-devtools" }
spring-boot-oauth2-resource-server = { module = "org.springframework.boot:spring-boot-starter-oauth2-resource-server" }
spring-boot-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-security-test = { module = "org.springframework.security:spring-security-test" }
testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
testcontainers-junit = { module = "org.testcontainers:testcontainers-junit-jupiter" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql" }

[bundles]
testing = [
    "junit-platform-launcher",
    "mockito-kotlin",
    "spring-boot-test",
    "spring-security-test",
    "testcontainers-junit",
    "testcontainers-postgresql",
]

[plugins]
detekt = { id = "dev.detekt", version.ref = "detekt" }
kotlin-allopen = { id = "org.jetbrains.kotlin.plugin.allopen", version.ref = "kotlin" }
kotlin-jpa = { id = "org.jetbrains.kotlin.plugin.jpa", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
openapi-generator = { id = "org.openapi.generator", version.ref = "openapi-generator" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
version = "nl.littlerobots.version-catalog-update:1.1.1"
