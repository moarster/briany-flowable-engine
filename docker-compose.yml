 services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flowable}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flowable}
      POSTGRES_DB: ${POSTGRES_DB:-flowable}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flowable}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  bpm:
    image: ${BPM_IMAGE:-briany-flowable-engine:latest}
    build:
      context: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-flowable}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-flowable}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-flowable}
      # Password of the seeded Flowable IDM admin user (login: admin).
      FLOWABLE_COMMON_APP_IDM_ADMIN_PASSWORD: ${IDM_ADMIN_PASSWORD:?set IDM_ADMIN_PASSWORD in .env}
      # Auth strategy: "flowable" = HTTP Basic against the engine's built-in IDM.
      BRIANY_SECURITY_AUTH_STRATEGY: ${BRIANY_SECURITY_AUTH_STRATEGY:-flowable}
    ports:
      - "${BPM_PORT:-8095}:8095"       # REST API
      - "${BPM_MGMT_PORT:-8096}:8096"  # actuator (health, prometheus)
    restart: unless-stopped

volumes:
  db-data:
